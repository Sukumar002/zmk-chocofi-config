# Shared behavior and power configuration.
# Display features are configured per shield so the central dongle can be display-free.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Hana Stage 1 feature parity: mouse emulation.
CONFIG_ZMK_POINTING=y
