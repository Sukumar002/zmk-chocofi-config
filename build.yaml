---
include:
  # Central dongle variants: Pro Micro / nice!nano-compatible nRF52840.
  - board: nice_nano//zmk
    shield: chocofi_central_dongle_128x64
    artifact-name: chocofi_central_128x64

  - board: nice_nano//zmk
    shield: chocofi_central_dongle_128x32
    artifact-name: chocofi_central_128x32

  # Standalone central-left mode (right half pairs as peripheral).
  - board: nice_nano//zmk
    shield: chocofi_central_left
    artifact-name: chocofi_left_central

  # Dongle topology: both halves are peripherals.
  - board: nice_nano//zmk
    shield: chocofi_peripheral_left
    artifact-name: chocofi_left_peripheral

  - board: nice_nano//zmk
    shield: chocofi_peripheral_right
    artifact-name: chocofi_right_peripheral

  # Shared settings reset image.
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
