---
include:
  # Display-free central dongle remains available as the known-good fallback.
  - board: nice_nano//zmk
    shield: chocofi_central_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: chocofi_central_dongle

  # Central dongle with 128x64 SSD1306 OLED.
  - board: nice_nano//zmk
    shield: chocofi_central_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: chocofi_central_dongle_128x64

  # Compact central dongle with 128x32 SSD1306 OLED.
  - board: nice_nano//zmk
    shield: chocofi_central_dongle_128x32 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: chocofi_central_dongle_128x32

  # Both physical halves are BLE peripherals to the central dongle.
  - board: nice_nano//zmk
    shield: chocofi_peripheral_left
    artifact-name: chocofi_left_peripheral

  - board: nice_nano//zmk
    shield: chocofi_peripheral_right
    artifact-name: chocofi_right_peripheral

  # Settings reset for the Pro Micro / nice!nano-compatible controllers.
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: chocofi_settings_reset
