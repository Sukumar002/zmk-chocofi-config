# Explicit split-central role
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Two Chocofi peripherals plus host profiles
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Battery-powered dongle support
CONFIG_ZMK_BATTERY=y
CONFIG_BT_BAS=y

# Show the dongle battery alongside the two wireless-half batteries
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y

# Fetch battery level from both halves
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Preserve Chocofi's physical left/right identity for battery labels
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SIDE_IDENTITY=y

# Display idle timeout
CONFIG_ZMK_IDLE_TIMEOUT=60000

# Enable keyboard-driven mouse emulation
CONFIG_ZMK_POINTING=y

# Match Hana's tested compact 128x32 renderer
CONFIG_ZMK_DISPLAY=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_I2C=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_DONGLE_DISPLAY_RAW_DASHBOARD=n
CONFIG_ZMK_DONGLE_DISPLAY_COMPACT_128X32=y

# Compact 32px UI: dashboard/modifier view toggle and active-only lock badges
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=y
CONFIG_ZMK_DONGLE_DISPLAY_CENTERED_LOCKS=y
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=n
CONFIG_ZMK_DONGLE_DISPLAY_WPM=n
