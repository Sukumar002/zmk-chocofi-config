# Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# nice-view-gem: no animation, fixed frame on the peripheral
CONFIG_NICE_VIEW_GEM_ANIMATION=n
CONFIG_NICE_VIEW_GEM_ANIMATION_FRAME=1

# Sleep after 15 minutes of inactivity
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Hana Stage 1 feature parity: mouse emulation.
CONFIG_ZMK_POINTING=y

# nice-oled on the right half: one static spaceman frame, no animation
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_SPACEMAN=y

# Battery reporting / display housekeeping
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=100
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300
