# Chocofi central dongle with Hana v2.3's LVGL compact 128x32 display.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Two Chocofi peripherals plus host profiles.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Peripheral battery telemetry; preserve physical left/right source identity.
CONFIG_ZMK_BATTERY=y
CONFIG_BT_BAS=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SIDE_IDENTITY=y

# Display and keyboard behavior.
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_POINTING=y

# Use the released Hana LVGL display path, not the experimental raw framebuffer
# renderer that performed synchronous I2C writes from key-event callbacks.
CONFIG_ZMK_DISPLAY=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_I2C=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_DONGLE_DISPLAY_COMPACT_MODE=y
