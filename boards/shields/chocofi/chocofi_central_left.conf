# Left half operating as the BLE split central; no local display hardware.
CONFIG_ZMK_KEYBOARD_NAME="Chocofi"
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
CONFIG_ZMK_BATTERY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SIDE_IDENTITY=y
CONFIG_BT_BAS=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_USB=y
