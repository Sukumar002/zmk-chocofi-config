name: Build Workflow

on:
  push:
    branches:
      - main
      - feature/chocofi-oled-dongle
  pull_request: 
    branches: 
      - main  # Specify your main branch
  workflow_dispatch:  # can be triggered manually

jobs:
  build:
    uses: Sukumar002/zmk/.github/workflows/build-user-config.yml@7e05bf9846900e6eafd7b4665ac5240dcaca7b39

  draw:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build  
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@467abe2a2fee3a1ec1658d8c3fe33d1cc562b53c
    permissions:
      contents: write 
    with:
      keymap_patterns: "config/chocofi.keymap"        # path to the keymaps to parse
      config_path: "keymap-drawer/config.yaml"  # config file, ignored if not exists
      output_folder: "keymap-drawer"            # path to save produced SVG and keymap YAML files
      parse_args: ""  # map of extra args to pass to `keymap parse`
      draw_args: ""   # map of extra args to pass to `keymap draw`
