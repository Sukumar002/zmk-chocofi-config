# Right half as BLE peripheral; no local display hardware.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_DISPLAY=n

# Expose the physical right side to the central dongle for battery labeling.
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_SIDE_IDENTITY=y
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_SIDE_ID=2
